main: net.tfminecraft.DrinkBuilder.DrinkBuilder
api-version: '1.21.10'
name: DrinkBuilder
version: ${project.version}
author: TFMC

depend: [TLibs, TFMCWeb]
softdepend: [ItemsAdder]
commands:
  drinkbuilder:
    usage: /drinkbuilder reload|catalog sync|pack pull [force]|pack reapply <id>|drink delete <id>
    description: DrinkBuilder admin tools
    permission: drinkbuilder.admin
    permission-message: You do not have permission to use /drinkbuilder.

permissions:
  drinkbuilder.admin:
    description: Admin /drinkbuilder commands
    default: op
